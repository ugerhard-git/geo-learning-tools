# Weekly update pull requests for the npm dev tooling and for the pinned
# GitHub Actions. Updates are grouped so a routine week is one PR per
# ecosystem rather than one per package.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
