# Weekly update pull requests for the npm dev tooling and for the pinned
# GitHub Actions. Updates are grouped so a routine week is one PR per
# ecosystem rather than one per package.
#
# The cooldown holds back a release until it is a week old. Most compromised
# packages are found and pulled within days, so this keeps them from being
# proposed at all.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-tooling:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
