:root{
  --bg:#EEF2F4; --panel:#FFFFFF; --ink:#16243A; --muted:#56667A; --line:#C9D4DD;
  --ocean:#CFDDE8; --land:#F7F6F1; --border:#A6B4C2;
  --water:#2E7BB8; --marine:#3E8FC4; --rock:#8A5A3B; --sand:#C29A45; --edge:#5E7186;
  --accent:#B3122E; --accent-ink:#FFFFFF;
  --ok:#1E7B4A; --bad:#B3122E; --near:#B87400; --tile:#E3E9EE; --warn-bg:#FFF4D6; --warn-ink:#5A4300;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --shadow:0 12px 40px rgba(16,30,48,.22);
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1620; --panel:#172231; --ink:#E7EDF3; --muted:#98A8BA; --line:#2B3B50;
    --ocean:#122030; --land:#333F4C; --border:#5C6E80;
    --water:#5FB3E8; --marine:#5AA8DE; --rock:#D39B72; --sand:#E3C067; --edge:#9FB3C6;
    --accent:#FF5A6E; --accent-ink:#1A0006;
    --ok:#4CC38A; --bad:#FF5A6E; --near:#E8B15C; --tile:#1D2A3A; --warn-bg:#3A2F10; --warn-ink:#F3DE9C;
    --shadow:0 12px 40px rgba(0,0,0,.5);
  }
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--ocean);color:var(--ink);font:16px/1.5 var(--body);display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--bg);border-bottom:1px solid var(--line);z-index:4}
header.top h1{font:800 1.5rem/1 var(--display);letter-spacing:-0.02em;margin:0 6px 0 0;white-space:nowrap}
.search{flex:1 1 200px;max-width:380px;position:relative}
.search[hidden]{display:none}
.search input{width:100%;padding:9px 12px 9px 38px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:8px 13px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.btn,select{padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn[disabled]{opacity:.5;cursor:default}
.spacer{flex:1}

#stage{position:relative;flex:1;min-height:0}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab;background:var(--ocean);user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}
#map.aim{cursor:crosshair}
#world path{fill:var(--land);stroke:var(--border);stroke-width:.55;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#world path.ocean{fill:var(--ocean);stroke:none}
#landbase path{fill:var(--land);stroke:var(--land);stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#feats g{pointer-events:none}
#feats g.off{display:none}
#feats path,#feats circle{vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.k-riv path,.k-lak path{fill:none;stroke:var(--water);stroke-width:1.6}
.k-lak path{fill:color-mix(in srgb,var(--water) 42%,transparent);stroke-width:.8}
.k-sea path,.k-gul path,.k-str path{fill:color-mix(in srgb,var(--marine) 15%,transparent);stroke:var(--marine);stroke-width:1;stroke-dasharray:5 4}
.k-rng path{fill:color-mix(in srgb,var(--rock) 26%,transparent);stroke:var(--rock);stroke-width:1}
.k-des path{fill:color-mix(in srgb,var(--sand) 30%,transparent);stroke:var(--sand);stroke-width:1}
.k-plt path{fill:color-mix(in srgb,var(--sand) 15%,transparent);stroke:var(--sand);stroke-width:.9;stroke-dasharray:4 3}
.k-isl path,.k-pen path,.k-reg path{fill:color-mix(in srgb,var(--edge) 12%,transparent);stroke:var(--edge);stroke-width:1;stroke-dasharray:3 3}
.k-pea circle{fill:var(--rock);stroke:var(--land);stroke-width:1}
#feats .on{stroke:var(--accent)!important;stroke-width:3!important;stroke-dasharray:none!important;fill:color-mix(in srgb,var(--accent) 30%,transparent)!important}
#feats .k-riv .on,#feats .k-pea .on{fill:none!important}
#feats .k-pea .on{fill:var(--accent)!important;stroke-width:2!important}
.tgt{fill:none;stroke:var(--accent);stroke-width:2.5;vector-effect:non-scaling-stroke;pointer-events:none}
.guess{fill:none;stroke:var(--bad);stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none}
.gline{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:6 5;vector-effect:non-scaling-stroke;pointer-events:none}

#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:4px 9px;border-radius:6px;font-size:.9rem;font-weight:700;white-space:nowrap;transform:translate(-50%,-140%);z-index:3}
.projsw{position:absolute;left:12px;top:12px;z-index:2;max-width:300px}
.projsw .seg{box-shadow:var(--shadow)}
.projsw .seg button{padding:6px 11px;font-size:.88rem}
.pnote{margin:6px 0 0;font-size:.8rem;color:var(--muted);background:color-mix(in srgb,var(--panel) 85%,transparent);padding:3px 8px;border-radius:6px}
.zoom{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom button{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);font-size:1.3rem;cursor:pointer;box-shadow:var(--shadow)}

#layers{position:absolute;right:14px;top:12px;z-index:3;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;max-width:210px}
#layers h4{margin:0 0 7px;font:800 .95rem/1.2 var(--display)}
#layers .row{display:flex;flex-wrap:wrap;gap:5px}
#layers button{border:1.5px solid var(--line);background:none;border-radius:8px;padding:3px 8px;cursor:pointer;font-size:.82rem;display:inline-flex;align-items:center;gap:5px}
#layers button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
#layers .sw{width:9px;height:9px;border-radius:2px;flex:none}
#layers .foot{margin:8px 0 0;font-size:.78rem;color:var(--muted)}
body.drill #layers,body.prog #layers{display:none}

#panel{position:absolute;top:12px;right:12px;bottom:12px;width:min(410px,calc(100% - 24px));background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:auto;z-index:7;padding:22px}
.close{width:38px;height:38px;border-radius:50%;border:0;background:var(--tile);cursor:pointer;font-size:1.25rem;line-height:1}
#panel .close{position:absolute;top:10px;right:10px}
#panel h2{font:800 clamp(1.5rem,3.5vw,2.05rem)/1.05 var(--display);letter-spacing:-0.02em;margin:0 44px 8px 0}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.tag{font-size:.85rem;padding:3px 9px;border-radius:6px;background:var(--tile);display:inline-flex;align-items:center;gap:6px}
.tag .sw{width:10px;height:10px;border-radius:2px}
dl.facts{display:grid;grid-template-columns:minmax(92px,auto) 1fr;gap:6px 14px;margin:0;font-size:.95rem}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0;overflow-wrap:anywhere}
#panel h3{font:800 1.05rem/1.2 var(--display);margin:20px 0 8px}
.prow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.prow .btn{padding:6px 11px;font-size:.92rem}
.wiki p{margin:0 0 .7em}
.src{font-size:.8rem;color:var(--muted);margin-top:18px}
.src a,.shint a,.wiki a{color:inherit}
.err{color:var(--muted);font-style:italic;margin:0}
.loading{color:var(--muted)}

#setup{position:absolute;inset:12px;margin:auto;width:min(700px,calc(100% - 24px));max-height:calc(100% - 24px);background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:auto;padding:24px;z-index:6}
#setup h2{font:800 1.7rem/1.05 var(--display);margin:0 0 4px;letter-spacing:-0.02em}
#setup .lead{color:var(--muted);margin:0 0 18px}
.fieldrow{margin:0 0 16px}
.flab{display:block;font-weight:700;margin:0 0 7px}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.types button{text-align:left;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer}
.types button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.types b{display:block;font:700 1rem/1.2 var(--body)}
.types span{font-size:.85rem;opacity:.8}
.selects{display:flex;flex-wrap:wrap;gap:8px}
.selects select{flex:1 1 170px;min-width:0}
.kinds{display:flex;flex-wrap:wrap;gap:6px}
.kinds button{border:1.5px solid var(--line);background:none;border-radius:999px;padding:5px 11px;cursor:pointer;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.kinds button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.kinds .sw{width:9px;height:9px;border-radius:2px}
.due{background:var(--tile);border-radius:10px;padding:11px 14px;margin:0 0 16px;font-size:.95rem}
.go{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

#drillbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(680px,calc(100% - 90px));background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:15px 18px;z-index:4}
@media (min-width:761px){ body.withpanel #drillbar{ left:calc(50% - 217px); width:min(680px,calc(100% - 524px)); } }
@media (max-width:760px){ body.withpanel #drillbar{ display:none } }
.qtop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:9px;font-size:.88rem;color:var(--muted)}
.qtop .btn{padding:4px 10px;font-size:.85rem}
.qscore{margin-left:auto}
.qprompt{font:800 1.2rem/1.25 var(--display);margin:0 0 10px}
.qprompt .sub{display:block;font:400 .85rem/1.4 var(--body);color:var(--muted);margin-top:3px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts button{padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;font-weight:700;text-align:left}
.opts button kbd{font:inherit;font-weight:400;color:var(--muted);margin-right:7px}
.opts button.right{background:var(--ok);border-color:var(--ok);color:#fff}
.opts button.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.opts button.right kbd,.opts button.wrong kbd{color:inherit}
.typed{display:flex;gap:8px}
.typed input{flex:1;min-width:0;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel)}
.aimnote{color:var(--muted);font-size:.95rem;margin:0}
.qfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;min-height:40px}
.qfoot .msg{flex:1 1 220px;font-weight:700}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)} .msg.near{color:var(--near)}

#progress{position:absolute;inset:12px;margin:auto;width:min(760px,calc(100% - 24px));max-height:calc(100% - 24px);background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:auto;padding:24px;z-index:6}
#progress h2{font:800 1.7rem/1.05 var(--display);margin:0 0 14px;letter-spacing:-0.02em}
#progress h3{font:800 1.05rem/1.2 var(--display);margin:22px 0 8px}
.pgStats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0 0 6px}
.pgStat{background:var(--tile);border-radius:10px;padding:12px 14px}
.pgStat b{display:block;font:800 1.5rem/1.1 var(--display)}
.pgStat span{font-size:.85rem;color:var(--muted)}
table.pgTable{width:100%;border-collapse:collapse;font-size:.93rem}
table.pgTable th,table.pgTable td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.pgTable th{color:var(--muted);font-weight:400}
table.pgTable td.pgNum{text-align:right;font-variant-numeric:tabular-nums}
.pgBar{display:block;height:8px;border-radius:4px;background:var(--tile);overflow:hidden;min-width:70px}
.pgBar i{display:block;height:100%;background:var(--ok)}
.pgWeak{display:flex;flex-wrap:wrap;gap:6px}
.pgWeak button{border:1.5px solid var(--line);background:none;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:.9rem}
.pgWeak .pgWn{color:var(--muted)}
.pgSrc{font-size:.85rem;color:var(--muted);margin-top:10px}

dialog{border:0;padding:0;border-radius:16px;background:var(--panel);color:var(--ink);width:min(560px,96vw);max-height:92vh;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,18,28,.6)}
.dlg{padding:26px;overflow:auto;max-height:92vh;position:relative}
.dlg .close{position:absolute;top:12px;right:12px}
.dlg h2{font:800 1.8rem/1.05 var(--display);margin:0 0 10px;letter-spacing:-0.02em}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.status{min-height:1.5em;margin:12px 0 0;font-weight:700}
.status.ok{color:var(--ok)} .status.bad{color:var(--bad)}
.shint{color:var(--muted);font-size:.92rem}
textarea.pgIo{width:100%;height:130px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:.82rem}

@media (max-width:760px){
  header.top{gap:8px}
  header.top h1{font-size:1.2rem}
  .search{order:5;flex-basis:100%;max-width:none}
  #layers{right:auto;left:12px;top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 76px)}
  .projsw{max-width:calc(100% - 90px)}
  .pnote{display:none}
  #panel{top:auto;left:0;right:0;bottom:0;width:100%;max-height:66%;border-radius:14px 14px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  #drillbar{width:calc(100% - 20px);bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:12px}
  #setup,#progress{inset:0;width:100%;max-height:100%;border-radius:0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
  body.drill .zoom,body.setup .zoom,body.prog .zoom{bottom:auto;top:56px}
  .opts{grid-template-columns:1fr}
  dialog{width:100vw;max-height:100vh;height:100%;border-radius:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const AIDX = new Int8Array(128).fill(-1);
for (let i=0;i<64;i++) AIDX[ALPHA.charCodeAt(i)] = i;
function unpack(s){
  const out = []; let u = 0, sh = 0;
  for (let i=0;i<s.length;i++){
    const v = AIDX[s.charCodeAt(i)];
    if (v < 0) continue;
    u |= (v & 31) << sh;
    if (v & 32) sh += 5; else { out.push(u & 1 ? -((u+1)>>1) : u>>1); u = 0; sh = 0; }
  }
  return out;
}

const GQ = D.Q.geom, PQ = D.Q.point;
const FEAT = D.FEATURES.split("\n").map((line,i)=>{
  const f = line.split("\t");
  const gt = f[8], raw = f[9] ? f[9].split("|") : [];
  const parts = [];
  let x0=180, y0=90, x1=-180, y1=-90;
  for (const part of raw){
    const v = unpack(part);
    if (v.length < 2) continue;
    const q = gt === "x" ? PQ : GQ;
    const arr = new Float64Array(v.length);
    let x = v[0], y = v[1];
    arr[0] = x/q; arr[1] = y/q;
    for (let k=2;k<v.length;k+=2){
      x += v[k]; y += v[k+1];
      arr[k] = x/q; arr[k+1] = y/q;
    }
    for (let k=0;k<arr.length;k+=2){
      if (arr[k]<x0) x0=arr[k]; if (arr[k]>x1) x1=arr[k];
      if (arr[k+1]<y0) y0=arr[k+1]; if (arr[k+1]>y1) y1=arr[k+1];
    }
    parts.push(arr);
  }
  return {i, kind:f[0], name:f[1], alts:f[2]?f[2].split(";").map(s=>s.trim()).filter(Boolean):[],

    inv(X,Y){

      let l=y, l2=l*l, l6=l2*l2*l2;
      for (let i=0;i<12;i++){
        const fy=l*(EE.A1+EE.A2*l2+l6*(EE.A3+EE.A4*l2))-y, fpy=EE.A1+3*EE.A2*l2+l6*(7*EE.A3+9*EE.A4*l2), dl=fy/fpy;
        l-=dl; l2=l*l; l6=l2*l2*l2; if (Math.abs(dl)<1e-12) break;
      }
      const lon = EE.M*x*(EE.A1+3*EE.A2*l2+l6*(7*EE.A3+9*EE.A4*l2))/Math.cos(l)/RAD;
      return [Math.max(-180,Math.min(180,lon)), Math.asin(Math.max(-1,Math.min(1,Math.sin(l)/EE.M)))/RAD];
    },
    ocean(){ const p=[]; for(let la=90;la>=-90;la--) p.push(this.fwd(-180,la)); for(let la=-90;la<=90;la++) p.push(this.fwd(180,la));
      return `M${p.map(q=>q.map(Math.round).join(" ")).join("L")}Z`; },
    extent:[0,0,20000,2*EE_H], home:[0,0,20000,2*EE_H]
  },
  merc: {
    name:"Mercator", note:"Mercator: true local shapes; areas grow toward the poles, so Greenland looks as big as Africa.",
    fwd(lon,lat){ const p=Math.max(-MERC_MAX,Math.min(MERC_MAX,lat))*RAD; return [10000+lon*RAD*MERC_S, MERC_H-Math.log(Math.tan(Math.PI/4+p/2))*MERC_S]; },
    inv(X,Y){ return [Math.max(-180,Math.min(180,(X-10000)/MERC_S/RAD)), (2*Math.atan(Math.exp((MERC_H-Y)/MERC_S))-Math.PI/2)/RAD]; },
    ocean(){ return `M0 0H20000V${Math.round(2*MERC_H)}H0Z`; },
    get extent(){ return [0,0,20000,2*MERC_H]; },
    get home(){ const t=this.fwd(0,84)[1], b=this.fwd(0,-60)[1]; return [0,t,20000,b-t]; }
  }
});
let projKey = (()=>{ const v = LS.get("flagatlas.projection"); return v==="merc" ? "merc" : "ee"; })();

/* ============================ distances ============================ */
function distKm(lo1,la1,lo2,la2){
  const dLat=(la2-la1)*RAD, dLon=(lo2-lo1)*RAD;
  const a=Math.sin(dLat/2)**2 + Math.cos(la1*RAD)*Math.cos(la2*RAD)*Math.sin(dLon/2)**2;
  return 6371*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function bearing(lo1,la1,lo2,la2){
  const y=Math.sin((lo2-lo1)*RAD)*Math.cos(la2*RAD);
  const x=Math.cos(la1*RAD)*Math.sin(la2*RAD)-Math.sin(la1*RAD)*Math.cos(la2*RAD)*Math.cos((lo2-lo1)*RAD);
  const d=(Math.atan2(y,x)/RAD+360)%360;
  return ["north","north-east","east","south-east","south","south-west","west","north-west"][Math.round(d/45)%8];
}
/* planar approximation, which is accurate enough over the spans these features cover */
function segDistKm(lo,la, ax,ay, bx,by){
  const k = Math.cos(la*RAD);
  const px=(ax-lo)*k, py=ay-la, qx=(bx-lo)*k, qy=by-la;
  const dx=qx-px, dy=qy-py, dd=dx*dx+dy*dy;
  const t = dd ? Math.max(0, Math.min(1, -(px*dx+py*dy)/dd)) : 0;
  const cx=px+dx*t, cy=py+dy*t;
  return Math.hypot(cx,cy)*111.195;
}
function inRing(arr, lo, la){
  let inside = false;
  for (let i=0, j=arr.length-2; i<arr.length; j=i, i+=2){
    const xi=arr[i], yi=arr[i+1], xj=arr[j], yj=arr[j+1];
    if ((yi>la)!==(yj>la) && lo < (xj-xi)*(la-yi)/(yj-yi)+xi) inside = !inside;
  }
  return inside;
}
/* distance in km from a point to a feature; zero when inside a polygon */
function featDist(f, lo, la){
  if (f.gt === "x"){
    let best = Infinity;
    for (const p of f.parts) best = Math.min(best, distKm(lo,la,p[0],p[1]));
    return best;
  }
  let best = Infinity;
  for (const p of f.parts){
    if (f.gt === "p" && inRing(p, lo, la)) return 0;
    const n = p.length;
    if (f.gt === "p"){
      for (let i=0, j=n-2; i<n; j=i, i+=2) best = Math.min(best, segDistKm(lo,la,p[j],p[j+1],p[i],p[i+1]));
    } else {
      for (let i=0; i<n-2; i+=2) best = Math.min(best, segDistKm(lo,la,p[i],p[i+1],p[i+2],p[i+3]));
    }
    if (best === 0) return 0;
  }
  return best;
}

/* ============================ map build ============================ */
function ringPath(packed, q, P, close){
  const v = unpack(packed);
  if (v.length < 4) return "";
  let x = v[0], y = v[1];
  const p0 = P.fwd(x/q, y/q);
  let d = "M" + (Math.round(p0[0]*10)/10) + " " + (Math.round(p0[1]*10)/10);
  for (let i=2;i<v.length;i+=2){
    x += v[i]; y += v[i+1];
    const p = P.fwd(x/q, y/q);
    d += "L" + (Math.round(p[0]*10)/10) + " " + (Math.round(p[1]*10)/10);
  }
  return d + (close ? "Z" : "");
}
function buildCountries(){
  const P = PROJ[projKey];
  const ds = CSHAPE.map(f=>f.r.map(r=>ringPath(r,CQ,P,true)).join(""));
  /* neighbouring outlines do not meet exactly once simplified, so a land-coloured
     backdrop underneath hides the slivers of ocean that would show at high zoom */
  gWorld.innerHTML = `<path class="ocean" d="${P.ocean()}"/>`
    + `<g id="landbase">${ds.map(d=>`<path d="${d}"/>`).join("")}</g>`
    + `<g id="landtop">${ds.map(d=>`<path d="${d}"/>`).join("")}</g>`;
}
const featEl = new Map();
function buildFeats(){
  const P = PROJ[projKey];
  let html = "";
  for (const k of KIND_ORDER){
    const list = FEAT.filter(f=>f.kind===k);
    html += `<g class="k-${k}${LAYERS.has(k)?"":" off"}" data-k="${k}">` + list.map(f=>{
      if (f.gt === "x"){ const [x,y] = P.fwd(f.parts[0][0], f.parts[0][1]);
        return `<circle data-f="${f.i}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="0"/>`; }
      const d = f.parts.map(p=>{
        let s = "";
        for (let i=0;i<p.length;i+=2){ const q = P.fwd(p[i],p[i+1]); s += (i?"L":"M") + (Math.round(q[0]*10)/10) + " " + (Math.round(q[1]*10)/10); }
        return s + (f.gt === "p" ? "Z" : "");
      }).join("");
      return `<path data-f="${f.i}" d="${d}"/>`;
    }).join("") + `</g>`;
  }
  gFeats.innerHTML = html;
  featEl.clear();
  gFeats.querySelectorAll("[data-f]").forEach(el=>featEl.set(+el.dataset.f, el));
}
function projXY(lon,lat){ return PROJ[projKey].fwd(lon,lat); }

/* ============================ view ============================ */
const view = {x:0,y:0,w:WORLD_W,h:WORLD_W/2};
const MIN_W = 30;
const maxW = ()=>Math.max(WORLD_W*1.1, PROJ[projKey].home[3]*1.05*cw/ch);
let cw = 1, ch = 1;
function size(){ const r = svg.getBoundingClientRect(); cw = Math.max(1,r.width); ch = Math.max(1,r.height); }
function setView(x,y,w){
  w = Math.min(maxW(), Math.max(MIN_W, w));
  const h = w*ch/cw, [ex,ey,ew,eh] = PROJ[projKey].extent;
  const cx = Math.min(ex+ew, Math.max(ex, x + w/2)), cy = Math.min(ey+eh, Math.max(ey, y + h/2));
  view.w = w; view.h = h; view.x = cx - w/2; view.y = cy - h/2;
  svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`);
  overlay();
}
function home(){ size(); const [hx,hy,hw,hh] = PROJ[projKey].home; const w = Math.max(hw*1.02, hh*1.02*cw/ch); setView(hx+hw/2 - w/2, hy+hh/2 - (w*ch/cw)/2, w); }
function toMap(clientX,clientY){ const r = svg.getBoundingClientRect(); return [view.x + (clientX-r.left)/cw*view.w, view.y + (clientY-r.top)/ch*view.h]; }
function toLonLat(clientX,clientY){ const [mx,my] = toMap(clientX,clientY); return PROJ[projKey].inv(mx,my); }
function zoomAt(mx,my,f){ const w = Math.min(maxW(), Math.max(MIN_W, view.w/f)), k = w/view.w; setView(mx-(mx-view.x)*k, my-(my-view.y)*k, w); }
let anim = 0;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function flyTo(cx,cy,w){
  cancelAnimationFrame(anim);
  w = Math.min(maxW(), Math.max(MIN_W, w));
  const a = {cx:view.x+view.w/2, cy:view.y+view.h/2, w:view.w};
  if (reduceMotion) return setView(cx-w/2, cy-(w*ch/cw)/2, w);
  const t0 = performance.now(), T = 620;
  const stepF = t=>{
    const u = Math.min(1,(t-t0)/T), e = u<.5 ? 2*u*u : 1-Math.pow(-2*u+2,2)/2;
    const ww = Math.exp(Math.log(a.w)+(Math.log(w)-Math.log(a.w))*e);
    setView(a.cx+(cx-a.cx)*e-ww/2, a.cy+(cy-a.cy)*e-(ww*ch/cw)/2, ww);
    if (u<1) anim = requestAnimationFrame(stepF);
  };
  anim = requestAnimationFrame(stepF);
}
function projBox(b){
  const P = PROJ[projKey];
  let a=Infinity,c=Infinity,d=-Infinity,e=-Infinity;
  for (let i=0;i<=6;i++) for (let j=0;j<=6;j++){
    const [x,y] = P.fwd(b[0]+b[2]*i/6, b[1]+b[3]*j/6);
    a=Math.min(a,x); c=Math.min(c,y); d=Math.max(d,x); e=Math.max(e,y);
  }
  return [a,c,d-a,e-c];
}
function bottomPad(){ const d = $("#drillbar"); return d.hidden ? 0 : d.offsetHeight + 28; }
function sidePad(){ return (!panel.hidden && innerWidth > 760) ? panel.offsetWidth + 24 : 0; }
function flyToBox(b, factor, minSpan){
  const [bx,by,bw,bh] = projBox(b);
  const pw = sidePad(), ph = bottomPad();
  const span = Math.max(bw*factor*cw/Math.max(200,cw-pw), bh*factor*cw/Math.max(160,ch-ph), minSpan);
  const k = span/cw;
  flyTo(bx+bw/2 + pw/2*k, by+bh/2 + ph/2*k, span);
}
function overlay(){
  const k = view.w/cw;
  gOver.querySelectorAll("[data-fix]").forEach(el=>{
    const s = +el.dataset.fix;
    if (el.tagName === "circle") el.setAttribute("r",(s*k).toFixed(2));
    else el.setAttribute("stroke-width",(s*k).toFixed(2));
  });
  const g = gFeats.querySelector(".k-pea");
  if (g && !g.classList.contains("off")){
    const r = (Math.min(4, Math.max(2.1, 2.1 + (200-Math.min(200,view.w/WORLD_W*360))/200*1.9))*k).toFixed(2);
    g.querySelectorAll("circle").forEach(c=>c.setAttribute("r", peaFilter && !peaFilter.has(+c.dataset.f) ? "0" : r));
  }
}
let peaFilter = null;

/* Pointer handling: drag to pan, pinch and wheel to zoom, tap to pick.
   Whenever the number of fingers changes, the gesture is re-anchored to where they are now and
   to the view as it stands. Carrying an old anchor across that moment is what makes a map leap:
   lift one finger of a pinch and the pan would otherwise still be measured from the other
   finger's first touch, against the width the view had before the zoom. */
const ptrs = new Map();
let gest = null;   // the gesture under way: {mode:"pan", x, y, vx, vy} or {mode:"pinch", d, cx, cy}
let tap = null;    // a single finger that has not yet moved far enough to count as a drag
function anchorGesture(){
  const pts = [...ptrs.values()];
  if (!pts.length) return (gest = null);
  if (pts.length===1){ gest = {mode:"pan", x:pts[0].x, y:pts[0].y, vx:view.x, vy:view.y}; return; }
  const [a,b] = pts;
  gest = {mode:"pinch", d:Math.hypot(a.x-b.x,a.y-b.y), cx:(a.x+b.x)/2, cy:(a.y+b.y)/2};
}
svg.addEventListener("pointerdown",e=>{
  if (e.button !== undefined && e.button > 0) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  cancelAnimationFrame(anim);
  tap = ptrs.size===1 ? {x:e.clientX,y:e.clientY,target:e.target} : null;  // two fingers is never a tap
  if (ptrs.size>1){ svg.classList.add("dragging"); hideTip(); }
  anchorGesture();
});
window.addEventListener("pointermove",e=>{
  if (!ptrs.has(e.pointerId)){ if (e.target.closest && e.target.closest("#map")) hover(e); return; }
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (!gest) return;
  if (tap){
    if (Math.hypot(e.clientX-tap.x, e.clientY-tap.y) <= 5) return;   // a touch, not yet a drag
    tap = null; svg.classList.add("dragging"); hideTip();
  }
  if (gest.mode==="pan")
    return setView(gest.vx - (e.clientX-gest.x)/cw*view.w, gest.vy - (e.clientY-gest.y)/ch*view.h, view.w);
  const pts = [...ptrs.values()]; if (pts.length<2) return;
  const [a,b] = pts, d = Math.hypot(a.x-b.x,a.y-b.y), cx = (a.x+b.x)/2, cy = (a.y+b.y)/2;
  // the map holds on to the point that was between the fingers, and follows them as they travel
  const [mx,my] = toMap(gest.cx, gest.cy);
  const w = Math.min(maxW(), Math.max(MIN_W, d>0 && gest.d>0 ? view.w*gest.d/d : view.w));
  const r = svg.getBoundingClientRect();
  setView(mx - (cx-r.left)/cw*w, my - (cy-r.top)/ch*(w*ch/cw), w);
  gest.d = d; gest.cx = cx; gest.cy = cy;
});
function endPtr(e){
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size===0){
    if (tap && e.type==="pointerup") pick(tap.x, tap.y);
    tap = null; gest = null; svg.classList.remove("dragging");
    return;
  }
  anchorGesture();   // carry on from where the fingers are now, against the view as it stands
}
window.addEventListener("pointerup",endPtr); window.addEventListener("pointercancel",endPtr);
svg.addEventListener("wheel",e=>{
  e.preventDefault(); cancelAnimationFrame(anim);
  const dy = e.deltaMode===1 ? e.deltaY*40 : e.deltaMode===2 ? e.deltaY*400 : e.deltaY;
  const [mx,my] = toMap(e.clientX,e.clientY);
  zoomAt(mx,my,Math.exp(-Math.max(-300,Math.min(300,dy))*0.0022));
},{passive:false});
svg.addEventListener("keydown",e=>{
  const step = view.w*0.1, cx = view.x+view.w/2, cy = view.y+view.h/2;
  const k = {ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,-step],ArrowDown:[0,step]}[e.key];
  if (k){ e.preventDefault(); setView(view.x+k[0],view.y+k[1],view.w); }
  if (e.key==="+"||e.key==="=") zoomAt(cx,cy,1.5);
  if (e.key==="-"||e.key==="_") zoomAt(cx,cy,1/1.5);
});
$("#zIn").addEventListener("click",()=>zoomAt(view.x+view.w/2,view.y+view.h/2,1.8));
$("#zOut").addEventListener("click",()=>zoomAt(view.x+view.w/2,view.y+view.h/2,1/1.8));
$("#zHome").addEventListener("click",home);
new ResizeObserver(()=>{ const c=[view.x+view.w/2,view.y+view.h/2], k=view.w/cw; size(); const w=k*cw; setView(c[0]-w/2,c[1]-(w*ch/cw)/2,w); }).observe(svg);

function setProjection(k){
  if (!PROJ[k] || k===projKey) return;
  const [lon,lat] = PROJ[projKey].inv(view.x+view.w/2, view.y+view.h/2);
  projKey = k; LS.set("flagatlas.projection", k);
  hideTip(); buildCountries(); buildFeats();
  if (selId != null) mark(selId, true);
  if (DS.item) mark(DS.item.i, true);
  drawOverlay();
  const [x,y] = PROJ[k].fwd(lon,lat);
  setView(x-view.w/2, y-view.h/2, view.w);
  syncProj();
}
function syncProj(){
  document.querySelectorAll("[data-proj]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.proj===projKey)));
  $("#projNote").textContent = PROJ[projKey].note;
}
document.addEventListener("click",e=>{ const b = e.target.closest("[data-proj]"); if (b) setProjection(b.dataset.proj); });

/* ============================ layers ============================ */
const DEFAULT_LAYERS = ["riv","lak","rng","des","sea"];
function savedLayers(){
  const v = LS.get("terrain.layers");
  const arr = v ? v.split(",").filter(k=>KINDS[k]) : null;
  return arr && arr.length ? arr : DEFAULT_LAYERS;
}
const LAYERS = new Set(savedLayers());
/* A drill narrows the map to one kind. That is a temporary view, not a change to what the
   viewer chose to see, so leaving the drill puts their own selection back. */
function restoreLayers(){ LAYERS.clear(); savedLayers().forEach(k=>LAYERS.add(k)); applyLayers(); }
function renderLayers(){
  $("#layerRow").innerHTML = KIND_ORDER.map(k=>
    `<button data-layer="${k}" aria-pressed="${LAYERS.has(k)}"><span class="sw" style="background:${KINDS[k].sw}"></span>${esc(KINDS[k].label)}</button>`).join("");
  $("#layerFoot").textContent = `${fmtNum(FEAT.filter(f=>LAYERS.has(f.kind)).length)} of ${fmtNum(FEAT.length)} features shown`;
}
function applyLayers(){
  gFeats.querySelectorAll("g[data-k]").forEach(g=>{ g.classList.toggle("off", !LAYERS.has(g.dataset.k)); });
  renderLayers(); overlay();
}
$("#layers").addEventListener("click",e=>{
  const b = e.target.closest("[data-layer]"); if (!b) return;
  const k = b.dataset.layer; if (!KINDS[k]) return;
  LAYERS.has(k) ? LAYERS.delete(k) : LAYERS.add(k);
  LS.set("terrain.layers", [...LAYERS].join(","));
  applyLayers();
});

/* ============================ picking and hover ============================ */
function candidates(lo, la, pad, onlyVisible){
  const out = [];
  for (const f of FEAT){
    if (onlyVisible && !LAYERS.has(f.kind)) continue;
    const b = f.b;
    if (lo < b[0]-pad || lo > b[0]+b[2]+pad || la < b[1]-pad || la > b[1]+b[3]+pad) continue;
    out.push(f);
  }
  return out;
}
/* Smaller features win ties, so a lake inside a sea is still reachable. */
function nearestFeature(lo, la, maxKm, onlyVisible){
  let best = null, bestD = Infinity, bestSize = Infinity;
  const pad = Math.min(8, maxKm/70);
  for (const f of candidates(lo, la, pad, onlyVisible)){
    const d = featDist(f, lo, la);
    if (d > maxKm) continue;
    const sizeRank = Math.max(f.b[2], f.b[3]);
    if (d < bestD - 0.001 || (Math.abs(d-bestD) <= 0.001 && sizeRank < bestSize)){ best = f; bestD = d; bestSize = sizeRank; }
  }
  return best;
}
const tip = $("#tip"); let hovId = null, hoverPending = null;
function hover(e){
  if (mode!=="explore" || (gest && !tap) || e.pointerType==="touch") return;
  hoverPending = e;
  if (hover.raf) return;
  hover.raf = requestAnimationFrame(()=>{
    hover.raf = 0;
    const ev = hoverPending; if (!ev) return;
    const [lo,la] = toLonLat(ev.clientX, ev.clientY);
    const f = nearestFeature(lo, la, view.w/cw*0.12*111, true);
    const id = f ? f.i : null;
    if (id !== hovId){ if (hovId!=null && hovId!==selId) markHover(hovId,false); hovId = id; if (id!=null) markHover(id,true); }
    if (!f) return hideTip();
    const r = $("#stage").getBoundingClientRect();
    tip.textContent = f.name; tip.hidden = false;
    tip.style.left = (ev.clientX-r.left)+"px"; tip.style.top = (ev.clientY-r.top)+"px";
  });
}
function hideTip(){ tip.hidden = true; if (hovId!=null && hovId!==selId){ markHover(hovId,false); } hovId = null; }
svg.addEventListener("pointerleave",hideTip);
function markHover(id,on){ const el = featEl.get(id); if (el && id!==selId) el.classList.toggle("on", on); }
function mark(id,on){ const el = featEl.get(id); if (el) el.classList.toggle("on", on); }

function pick(clientX, clientY){
  if (mode==="drill"){ drillClick(clientX, clientY); return; }
  if (mode!=="explore") return;
  const [lo,la] = toLonLat(clientX, clientY);
  const f = nearestFeature(lo, la, view.w/cw*0.12*111, true);
  if (f) select(f.i, false); else closePanel();
}

/* ============================ search ============================ */
const SEARCH = new Map();
FEAT.forEach(f=>[f.name,...f.alts].forEach(n=>{ const k = norm(n); if (k && !SEARCH.has(k)) SEARCH.set(k, f.i); }));
$("#names").innerHTML = FEAT.slice().sort((a,b)=>a.name.localeCompare(b.name,"en")).slice(0,1200)
  .map(f=>`<option value="${esc(f.name)}">`).join("");
function findFeature(q){
  const k = norm(String(q).trim()); if (!k) return null;
  if (SEARCH.has(k)) return SEARCH.get(k);
  const a = FEAT.find(f=>norm(f.name).startsWith(k));
  if (a) return a.i;
  const b = FEAT.find(f=>norm(f.name).includes(k));
  return b ? b.i : null;
}
$("#q").addEventListener("change",e=>{ const i = findFeature(e.target.value.slice(0,60)); if (i!=null){ select(i,true); e.target.blur(); } });
$("#q").addEventListener("keydown",e=>{ if (e.key==="Enter"){ const i = findFeature(e.target.value.slice(0,60)); if (i!=null){ select(i,true); e.target.blur(); } } });

/* ============================ overlay markers ============================ */
let overlayItems = [];
function drawOverlay(){
  gOver.innerHTML = overlayItems.map(o=>{
    const [x,y] = projXY(o.lon,o.lat);
    if (o.k==="ring") return `<circle class="tgt" data-fix="${o.s||16}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="0"/>`;
    if (o.k==="guess") return `<circle class="guess" data-fix="${o.s||7}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="0"/>`;
    if (o.k==="line"){ const [x2,y2] = projXY(o.lon2,o.lat2);

/* ---- Wikidata and Wikipedia, keyed by the id Natural Earth ships ---- */
const wdCache = new Map();
const WD_PROPS = [["P2043","Length","km"],["P2044","Elevation","m"],["P2046","Area","km²"],
                  ["P4511","Greatest depth","m"],["P2049","Width","km"],["P610","Highest point",""],
                  ["P885","Source","" ],["P403","Mouth","" ],["P138","Named after",""]];
function loadWD(f){
  clearTimeout(wdTimer);
  const el = ()=>document.getElementById("wd");
  if (!/^Q\d{1,12}$/.test(f.qid||"")){
    if (el()) el().innerHTML = `<p class="err" style="margin-top:14px">Natural Earth has no Wikidata id for this feature, so there is nothing to look up automatically.</p>`;
    return;
  }
  if (el()) el().innerHTML = `<p class="loading" style="margin-top:14px">Loading from Wikidata…</p>`;
  wdTimer = setTimeout(async ()=>{
    try{
      const v = wdCache.get(f.qid) || await fetchWD(f.qid);
      wdCache.set(f.qid, v);
      if (factsFor !== f.i || !el()) return;
      const rows = v.rows.map(r=>`<dt>${esc(r.label)}</dt><dd>${esc(r.text)}</dd>`).join("");
      el().innerHTML = (v.desc?`<p class="shint" style="margin:14px 0 0">${esc(v.desc)}</p>`:"")
        + (rows?`<h3>Measurements</h3><dl class="facts">${rows}</dl>`:"")
        + (v.extract?`<h3>About</h3><div class="wiki">${v.extract.split(/\n+/).slice(0,3).map(p=>`<p>${esc(p)}</p>`).join("")}
            ${v.title?`<p><a href="https://en.wikipedia.org/wiki/${encodeURIComponent(v.title.replace(/ /g,"_"))}" target="_blank" rel="noopener noreferrer">Read “${esc(v.title)}” on Wikipedia</a></p>`:""}</div>`:"")
        + `<p class="src">Measurements: <a href="https://www.wikidata.org/wiki/${esc(f.qid)}" target="_blank" rel="noopener noreferrer">Wikidata</a>, community-edited. Text: Wikipedia (CC BY-SA).</p>`;
      if (!rows && !v.extract && !v.desc) el().innerHTML = `<p class="err" style="margin-top:14px">Wikidata has no extra detail recorded for this feature.</p>`;
    }catch(e){
      if (factsFor === f.i && el())
        el().innerHTML = `<p class="err" style="margin-top:14px">${e instanceof HttpError && e.status===429
          ? "Wikidata is rate-limiting requests. Wait a minute and reopen the feature."
          : "Wikidata couldn't be reached. Check your connection and reopen the feature."}</p>`;
    }
  }, 320);
}
async function fetchWD(qid){
  const j = await getJSON(`https://www.wikidata.org/w/api.php?action=wbgetentities&format=json&origin=*&props=claims|sitelinks|descriptions&languages=en&sitefilter=enwiki&ids=${qid}`);
  const ent = j?.entities?.[qid] || {};
  const claims = ent.claims || {};
  const rows = [], ids = new Set();
  for (const [pid,label,unit] of WD_PROPS){
    const list = Array.isArray(claims[pid]) ? claims[pid] : [];
    for (const c of list){
      if (c?.rank === "deprecated") continue;
      const dv = c?.mainsnak?.datavalue; if (!dv) break;
      if (dv.type === "quantity"){
        const n = Number(dv.value?.amount);
        if (!isFinite(n)) break;
        rows.push({label, text: fmtNum(Math.round(n*100)/100) + (unit?" "+unit:"")});
      } else if (dv.type === "wikibase-entityid" && /^Q\d{1,12}$/.test(dv.value?.id||"")){
        rows.push({label, qid:dv.value.id, text:""}); ids.add(dv.value.id);
      }
      break;
    }
  }
  if (ids.size){
    try{
      const l = await getJSON(`https://www.wikidata.org/w/api.php?action=wbgetentities&format=json&origin=*&props=labels&languages=en&ids=${[...ids].slice(0,20).join("|")}`);
      for (const r of rows) if (r.qid) r.text = str(l?.entities?.[r.qid]?.labels?.en?.value, 120) || "";
    }catch{}
  }
  const title = str(ent.sitelinks?.enwiki?.title, 200);
  let extract = "";
  if (title){
    try{
      const w = await getJSON(`https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=extracts&exintro=1&explaintext=1&titles=${encodeURIComponent(title)}`);
      const pg = Object.values(w?.query?.pages||{})[0];
      if (pg && typeof pg.extract === "string") extract = pg.extract.slice(0,4000);
    }catch{}
  }
  return {rows: rows.filter(r=>r.text), desc: str(ent.descriptions?.en?.value, 240), title, extract};
}

/* ============================ progress ============================ */
const PROG_LS = "terrainatlas.progress.v1";
const BOXES = [0,2,5,12,30];
const today = ()=>Math.floor(Date.now()/864e5);
function loadProg(){
  const raw = LS.json(PROG_LS), out = Object.create(null);
  if (!raw) return out;
  for (const [k,v] of Object.entries(raw)){
    if (typeof k!=="string" || k.length>90 || !Array.isArray(v) || v.length!==4) continue;
    const e = v.map(x=>Number.isInteger(x)?x:0);
    if (e[0]<1 || e[0]>BOXES.length) continue;
    out[k] = e;
  }
  return out;
}
let PROG = loadProg(), progDirty = false, progTimer = 0;
function saveProg(){
  clearTimeout(progTimer); progDirty = true;
  progTimer = setTimeout(()=>{ LS.set(PROG_LS, JSON.stringify(PROG)); progDirty = false; }, 400);
}
window.addEventListener("beforeunload",()=>{ if (progDirty) LS.set(PROG_LS, JSON.stringify(PROG)); });
const DRILLS = table({
  locate: {label:"Locate",        blurb:"Name given, click the map"},
  name:   {label:"Name it",       blurb:"Feature highlighted, name it"},
  clue:   {label:"From the clue", blurb:"Named by the countries it touches"}
});
const itemKey = (type,f)=>`${type[0]}:${f.kind}/${f.name}`;
function record(type, f, ok){
  const k = itemKey(type,f), e = PROG[k] || [1,0,0,0];
  e[0] = ok ? Math.min(BOXES.length, e[0]+1) : 1;
  e[1] = today() + BOXES[e[0]-1];
  e[2] += 1; if (!ok) e[3] += 1;
  PROG[k] = e; saveProg();
}
const isNew = (t,f)=>!PROG[itemKey(t,f)];
const isDue = (t,f)=>{ const e = PROG[itemKey(t,f)]; return !e || e[1] <= today(); };
const boxOf = (t,f)=>PROG[itemKey(t,f)]?.[0] || 0;

/* ============================ drills ============================ */
const rnd = n=>{ const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]%n; };
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; }
/* Natural Earth's scalerank stands in for how well known a feature is; peaks use height. */
const LEVELS = table({ "2":{label:"Well known only"}, "4":{label:"Well known and common"}, "9":{label:"Everything"} });
const DS = {
  level: LEVELS[LS.get("terrain.level")] ? LS.get("terrain.level") : "4",
  type: LS.get("terrain.type") || "locate",
  kinds: new Set((LS.get("terrain.kinds")||"riv,rng,des,sea").split(",").filter(k=>KINDS[k])),
  scope: LS.get("terrain.scope") || "W",
  hard: LS.get("terrain.hard")==="1",
  len: +(LS.get("terrain.len")||20),
  queue:[], at:0, right:0, done:0, answered:false, item:null, opts:[], tol:300, session:[], repeated:new Set()
};
if (!DRILLS[DS.type]) DS.type = "locate";
if (!DS.kinds.size) DS.kinds = new Set(["riv","rng","des","sea"]);
if (![10,20,40,0].includes(DS.len)) DS.len = 20;
if (!(DS.scope==="W" || CONT[DS.scope])) DS.scope = "W";

function poolFor(){
  const max = +DS.level;
  return FEAT.filter(f=>DS.kinds.has(f.kind)
    && f.sr <= max
    && (DS.scope==="W" || f.cont===DS.scope)
    // a clue naming one country rarely has a single answer, so this drill needs two or more
    && (DS.type!=="clue" || f.countries.length >= 2));
}
function poolBox(list){
  let x0=180,y0=90,x1=-180,y1=-90;
  for (const f of list){ x0=Math.min(x0,f.b[0]); y0=Math.min(y0,f.b[1]); x1=Math.max(x1,f.b[0]+f.b[2]); y1=Math.max(y1,f.b[1]+f.b[3]); }
  return [x0,y0,x1-x0,y1-y0];
}
function setupHTML(){
  const pool = poolFor();
  const due = pool.filter(f=>!isNew(DS.type,f) && isDue(DS.type,f)).length;
  const fresh = pool.filter(f=>isNew(DS.type,f)).length;
  const counts = Object.create(null);
  FEAT.forEach(f=>{ if ((DS.scope==="W" || f.cont===DS.scope) && f.sr <= +DS.level) counts[f.kind] = (counts[f.kind]||0)+1; });
  return `<h2>Drill</h2>
    <p class="lead">Physical geography: what is where, and what it is called. Wrong answers come back sooner.</p>
    <div class="fieldrow"><span class="flab">What to practise</span>
      <div class="types" role="group" aria-label="Drill type">
        ${Object.entries(DRILLS).map(([k,v])=>`<button data-type="${k}" aria-pressed="${k===DS.type}"><b>${esc(v.label)}</b><span>${esc(v.blurb)}</span></button>`).join("")}
      </div>
    </div>
    <div class="fieldrow"><span class="flab">Which kinds of feature</span>
      <div class="kinds" role="group" aria-label="Feature kinds">
        ${KIND_ORDER.map(k=>`<button data-kind="${k}" aria-pressed="${DS.kinds.has(k)}"><span class="sw" style="background:${KINDS[k].sw}"></span>${esc(KINDS[k].label)} <span style="opacity:.7">${counts[k]||0}</span></button>`).join("")}
      </div>
    </div>
    <div class="fieldrow"><span class="flab">Where and how</span>
      <div class="selects">
        <select id="dScope" aria-label="Region">
          <option value="W"${DS.scope==="W"?" selected":""}>Whole world</option>
          ${Object.entries(CONT).map(([k,v])=>`<option value="${k}"${k===DS.scope?" selected":""}>${esc(v)}</option>`).join("")}
        </select>
        ${DS.type==="locate" ? "" :
          `<div class="seg" role="group" aria-label="Difficulty"><button data-hard="0" aria-pressed="${!DS.hard}">Easy: four choices</button><button data-hard="1" aria-pressed="${DS.hard}">Hard: type it</button></div>`}
        <select id="dLevel" aria-label="How well known">${Object.entries(LEVELS).map(([k,v])=>`<option value="${k}"${k===DS.level?" selected":""}>${esc(v.label)}</option>`).join("")}</select>
        <select id="dLen" aria-label="Session length">${[[10,"10 questions"],[20,"20 questions"],[40,"40 questions"],[0,"Keep going"]].map(([k,v])=>`<option value="${k}"${k===DS.len?" selected":""}>${v}</option>`).join("")}</select>
      </div>
      ${DS.type==="locate"?`<p class="lead" style="margin:10px 0 0">Click where you think it is. You are told how far off you were.</p>`:""}
    </div>
    <p class="due">${pool.length>1 ? `<b>${fmtNum(pool.length)}</b> in this set · <b>${fmtNum(due)}</b> due for review · <b>${fmtNum(fresh)}</b> not seen yet`
      : "Not enough features match. Pick more kinds, or a wider region."}</p>
    <div class="go">
      <button class="btn primary" id="dStart"${pool.length<2?" disabled":""}>Start drill</button>
      ${due ? `<button class="btn" id="dDue">Review the ${fmtNum(due)} due</button>` : ""}
      <button class="btn quiet" data-mode="explore">Back to the map</button>
    </div>`;
}
function renderSetup(){

  $("#setup").hidden = false; $("#drillbar").hidden = true;
  setOverlay([]); if (DS.item) mark(DS.item.i,false);
  DS.item = null; peaFilter = null; restoreLayers();
}
$("#setup").addEventListener("click",e=>{
  const t = e.target.closest("[data-type]");
  if (t && DRILLS[t.dataset.type]){ DS.type = t.dataset.type; LS.set("terrain.type",DS.type); return renderSetup(); }
  const k = e.target.closest("[data-kind]");
  if (k && KINDS[k.dataset.kind]){
    const key = k.dataset.kind;
    DS.kinds.has(key) ? DS.kinds.delete(key) : DS.kinds.add(key);
    if (!DS.kinds.size) DS.kinds.add(key);
    LS.set("terrain.kinds",[...DS.kinds].join(",")); return renderSetup();
  }

  if (h){ DS.hard = h.dataset.hard==="1"; LS.set("terrain.hard",DS.hard?"1":"0"); return renderSetup(); }

$("#setup").addEventListener("change",e=>{

  if (e.target.id==="dLen"){ DS.len = +e.target.value; LS.set("terrain.len",String(DS.len)); renderSetup(); }
  if (e.target.id==="dLevel"){ DS.level = LEVELS[e.target.value] ? e.target.value : "4"; LS.set("terrain.level",DS.level); renderSetup(); }
});
function startDrill(dueOnly){
  const pool = poolFor();
  if (pool.length < 2) return;
  const due = shuffle(pool.filter(f=>!isNew(DS.type,f) && isDue(DS.type,f)));
  const fresh = shuffle(pool.filter(f=>isNew(DS.type,f)));
  const rest = shuffle(pool.filter(f=>!isNew(DS.type,f) && !isDue(DS.type,f)));
  const n = DS.len || Math.min(pool.length, 100);
  let q;
  if (dueOnly) q = due.slice(0, DS.len || due.length);
  else {
    const wantDue = Math.min(due.length, Math.round(n*0.7));
    q = due.slice(0, wantDue).concat(fresh.slice(0, n-wantDue));
    if (q.length < n) q = q.concat(rest).slice(0, n);
    q = shuffle(q.slice(0, n));
  }
  if (!q.length) q = shuffle(pool.slice()).slice(0, n);
  DS.queue = q; DS.at = 0; DS.right = 0; DS.done = 0; DS.session = []; DS.repeated = new Set();
  const box = poolBox(pool);
  DS.tol = Math.max(60, Math.min(700, distKm(box[0],box[1],box[0]+box[2],box[1]+box[3])*0.05));
  $("#setup").hidden = true; $("#drillbar").hidden = false;
  nextQ();
}
/* answer matching, the same forgiving rules the other atlases use */
const akey = s=>norm(s).replace(/&/g," and ").replace(/\bsaint\b|\bst\b\.?/g,"st").replace(/\bmount\b|\bmt\b\.?/g,"mount")
  .replace(/\bthe\b/g," ").replace(/[^a-z0-9]/g,"");
function lev(a,b){
  if (Math.abs(a.length-b.length)>2) return 3;
  let prev = Array.from({length:b.length+1},(_,i)=>i);
  for (let i=1;i<=a.length;i++){ const cur=[i]; for (let j=1;j<=b.length;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return prev[b.length];
}
const namesOf = f=>[f.name, ...f.alts];
function judgeTyped(input, item, pool){
  const k = akey(String(input).slice(0,60)); if (!k) return null;
  const accept = clueAnswers(item, pool);
  const own = accept.flatMap(namesOf).map(akey).filter(Boolean);
  if (own.includes(k)) return {ok:true};
  for (const o of pool){ if (!accept.includes(o) && namesOf(o).map(akey).includes(k)) return {ok:false, other:o}; }
  if (own.some(n=>lev(k,n) <= (n.length>=10?2:n.length>=5?1:0))) return {ok:true, typo:true};
  return {ok:false};
}
/* Everything that would also be a correct answer to the clue as asked. */
function clueAnswers(item, pool){
  if (DS.type !== "clue") return [item];
  const want = item.countries.slice(0,4);
  return pool.filter(o=>o.kind===item.kind && want.every(c=>o.countries.includes(c)));
}
function nearbyOptions(item, pool, n){
  const alsoRight = new Set(clueAnswers(item, pool).map(o=>o.name));
  const cand = pool.filter(o=>o!==item && o.name!==item.name && !alsoRight.has(o.name));
  const sameKind = cand.filter(o=>o.kind===item.kind);
  const from = sameKind.length >= n ? sameKind : cand;
  const sorted = from.map(o=>({o, d:distKm(item.m[0],item.m[1],o.m[0],o.m[1])})).sort((a,b)=>a.d-b.d);
  const seen = new Set([item.name]), out = [];
  for (const {o} of sorted){ if (seen.has(o.name)) continue; seen.add(o.name); out.push(o); if (out.length>=n*3) break; }
  return shuffle(out).slice(0,n);
}
function nextQ(){
  if (DS.len && DS.at >= DS.queue.length) return endSession();
  if (DS.at >= DS.queue.length) DS.queue = DS.queue.concat(shuffle(poolFor()).slice(0,20));
  const item = DS.queue[DS.at];
  if (DS.item) mark(DS.item.i,false);
  DS.item = item; DS.answered = false;
  const pool = poolFor();
  DS.opts = (!DS.hard && DS.type!=="locate") ? shuffle([item, ...nearbyOptions(item, pool, 3)]) : [];
  showQuestion(item);
}
function showQuestion(f){
  const kindLabel = KINDS[f.kind].one.toLowerCase();

  if (DS.type==="locate"){
    main = `Where is ${esc(f.name)}?`;
    sub = `${esc(KINDS[f.kind].one)} · ${esc(CONT[f.cont]||"")} · click the map`;
    body = `<p class="aimnote">Click where you think it is. Zoom in first if you want to be precise.</p>`;
  } else if (DS.type==="name"){
    main = `Which ${esc(kindLabel)} is highlighted?`;
    sub = esc(CONT[f.cont]||"");
  } else {
    main = `Which ${esc(kindLabel)} ${f.kind==="riv"?"flows through":f.gt==="x"?"stands in":"touches"} ${esc(f.countries.slice(0,4).join(", "))}?`;
    sub = esc(CONT[f.cont]||"");
  }
  if (DS.type!=="locate"){
    body = DS.hard
      ? `<div class="typed"><input id="dIn" maxlength="60" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Type the name"><button class="btn primary" data-check>Check</button></div>`
      : `<div class="opts">${DS.opts.map((o,i)=>`<button data-a="${i}"><kbd>${i+1}</kbd>${esc(o.name)}</button>`).join("")}</div>`;
  }
  $("#drillbar").innerHTML = `
    <div class="qtop">
      <button class="btn" data-setup>Change drill</button>
      <span>${esc(DRILLS[DS.type].label)}</span>
      <span class="qscore">${[DS.done?`${DS.right} of ${DS.done} right`:"", DS.len?`question ${Math.min(DS.at+1,DS.queue.length)} of ${DS.queue.length}`:""].filter(Boolean).join(" · ")}</span>
    </div>
    <p class="qprompt">${main}<span class="sub">${sub}</span></p>
    ${body}
    <div class="qfoot" id="dFoot"><button class="btn quiet" data-skip>Show answer</button></div>`;
  // what the map shows while the question stands
  setOverlay([]);
  const pool = poolFor();
  if (DS.type==="name"){
    LAYERS.clear(); LAYERS.add(f.kind); applyLayers();
    peaFilter = f.kind==="pea" ? new Set([f.i]) : null;
    mark(f.i,true);
    if (f.kind==="pea") setOverlay([{k:"ring",lon:f.parts[0][0],lat:f.parts[0][1],s:15}]);
    flyToBox(f.b, f.gt==="x" ? 1 : 3.0, f.gt==="x" ? 1500 : 420);
  } else {
    LAYERS.clear(); applyLayers(); peaFilter = null;
    // both remaining drills start from a neutral view, so the last answer's position is no clue
    flyToBox(poolBox(pool), 1.06, 700);
    if (DS.type==="locate") svg.classList.add("aim");
  }
  if (DS.type!=="locate") svg.classList.remove("aim");
  if (DS.hard && DS.type!=="locate") setTimeout(()=>$("#dIn")?.focus({preventScroll:true}), 40);
  overlay();
}
function revealAnswer(){
  const f = DS.item;
  LAYERS.clear(); LAYERS.add(f.kind); applyLayers();
  peaFilter = f.kind==="pea" ? new Set([f.i]) : null;
  mark(f.i,true);
  if (f.gt==="x") setOverlay([...overlayItems.filter(o=>o.k!=="ring"), {k:"ring",lon:f.parts[0][0],lat:f.parts[0][1],s:15}]);
  overlay();
}
function finish(ok, msg, cls){
  DS.answered = true; DS.done++; if (ok) DS.right++;
  const f = DS.item;
  record(DS.type, f, ok);
  if (!ok && !DS.repeated.has(f) && DS.queue.length < DS.at + 40){
    DS.repeated.add(f);
    DS.queue.splice(Math.min(DS.queue.length, DS.at + 4 + rnd(3)), 0, f);
  }
  DS.session.push({ok, id:f.i, label:f.name});
  DS.at++;
  svg.classList.remove("aim");
  const last = DS.len && DS.at >= DS.queue.length;
  $("#dFoot").innerHTML = `<span class="msg ${cls||(ok?"ok":"bad")}">${msg}</span>
    <button class="btn" data-look>Details</button>
    <button class="btn primary" data-next>${last?"Finish":"Next"}</button>`;
  $("#dFoot [data-next]").focus({preventScroll:true});
}
function drillClick(clientX, clientY){
  if (mode!=="drill" || DS.type!=="locate" || DS.answered || !DS.item) return;
  const [lo,la] = toLonLat(clientX, clientY);
  const f = DS.item;
  const d = featDist(f, lo, la);
  const ok = d <= DS.tol;
  // draw the line to the closest point of the feature, not to its centre
  let tx = f.m[0], ty = f.m[1], bd = Infinity;
  for (const p of f.parts) for (let i=0;i<p.length;i+=2){
    const dd = distKm(lo,la,p[i],p[i+1]); if (dd < bd){ bd = dd; tx = p[i]; ty = p[i+1]; }
  }
  setOverlay([{k:"line",lon:lo,lat:la,lon2:tx,lat2:ty},{k:"guess",lon:lo,lat:la,s:7}]);
  revealAnswer();
  // one bearing, always read the same way: where the feature lies as seen from the click
  const away = `${d<10?d.toFixed(1):Math.round(d)} km ${bearing(lo,la,tx,ty)} of your click`;
  finish(ok, ok ? (d < 1 ? "Correct — spot on." : `Correct — ${esc(d<10?d.toFixed(1):Math.round(d))} km out.`)
              : `Not quite. ${esc(f.name)} is ${esc(away)}.`,
         ok ? "ok" : (d <= DS.tol*2.5 ? "near" : "bad"));
}
function checkTyped(){
  const i = $("#dIn"); if (!i || DS.answered) return;
  const r = judgeTyped(i.value, DS.item, poolFor());
  if (!r){ i.focus(); return; }
  i.disabled = true; $("#drillbar [data-check]")?.setAttribute("disabled","");
  revealAnswer();
  const alt = clueAnswers(DS.item, poolFor()).length - 1;
  const also = alt > 0 ? ` ${alt} other${alt>1?"s":""} would also have counted.` : "";
  const want = esc(DS.item.name);
  if (r.ok) finish(true, (r.typo ? `Correct: ${want}.` : "Correct.") + also);
  else finish(false, r.other ? `That is ${esc(r.other.name)}. The answer is ${want}.` : `Not quite. The answer is ${want}.`);
}
$("#drillbar").addEventListener("click",e=>{
  if (e.target.closest("[data-setup]")) return renderSetup();
  if (e.target.closest("[data-next]")) return nextQ();
  if (e.target.closest("[data-look]")) return showDetails(DS.item.i);
  if (e.target.closest("[data-check]")) return checkTyped();
  if (e.target.closest("[data-skip]") && !DS.answered){
    const i = $("#dIn"); if (i) i.disabled = true;
    revealAnswer();
    return finish(false, `The answer is ${esc(DS.item.name)}.`);
  }
  const a = e.target.closest("[data-a]");
  if (a && !DS.answered){
    const right = new Set(clueAnswers(DS.item, poolFor()));
    const chosen = DS.opts[+a.dataset.a], ok = right.has(chosen);
    $("#drillbar").querySelectorAll("[data-a]").forEach(b=>{
      const o = DS.opts[+b.dataset.a];
      if (right.has(o)) b.classList.add("right"); else if (b===a) b.classList.add("wrong");
    });
    revealAnswer();
    finish(ok, ok ? "Correct." : `That is ${esc(chosen.name)}. The answer is ${esc(DS.item.name)}.`);
  }
});
document.addEventListener("keydown",e=>{
  if (mode!=="drill" || document.querySelector("dialog[open]")) return;
  if (e.target.id==="dIn" && e.key==="Enter"){ e.preventDefault(); DS.answered ? nextQ() : checkTyped(); return; }
  if (e.target.matches("input,select,textarea")) return;
  if (!DS.answered && !DS.hard && DS.type!=="locate" && /^[1-4]$/.test(e.key)) $("#drillbar").querySelectorAll("[data-a]")[+e.key-1]?.click();
  else if (DS.answered && e.key==="Enter" && !e.target.closest("button")){ e.preventDefault(); nextQ(); }
});
function endSession(){
  $("#drillbar").hidden = true;
  if (DS.item) mark(DS.item.i,false);
  DS.item = null; setOverlay([]); peaFilter = null; restoreLayers();
  const pct = DS.done ? Math.round(DS.right/DS.done*100) : 0;
  const seen = new Set();
  const missed = DS.session.filter(s=>!s.ok && !seen.has(s.id) && seen.add(s.id));
  $("#setup").innerHTML = `<h2>Session done</h2>
    <p class="lead">${DS.right} of ${DS.done} right — ${pct}%.</p>
    ${missed.length?`<h3 style="font:800 1.05rem/1.2 var(--display);margin:18px 0 8px">Worth another look</h3>
      <div class="pgWeak">${missed.slice(0,24).map(s=>`<button data-look="${s.id}">${esc(s.label)}</button>`).join("")}</div>`:`<p>Nothing missed.</p>`}
    <div class="go" style="margin-top:20px">
      <button class="btn primary" id="dAgain">Another session</button>
      <button class="btn" data-mode="prog">See progress</button>
      <button class="btn quiet" data-mode="explore">Back to the map</button>
    </div>`;
  $("#setup").hidden = false;
  $("#dAgain")?.addEventListener("click",()=>renderSetup());
  $("#setup").querySelectorAll("[data-look]").forEach(b=>b.addEventListener("click",()=>showDetails(+b.dataset.look)));
}

/* ============================ progress screen ============================ */
function renderProgress(){
  const stats = Object.keys(DRILLS).map(t=>{
    let seen=0, learned=0, due=0, tries=0, wrong=0;
    for (const f of FEAT){
      const e = PROG[itemKey(t,f)];
      if (!e) continue;
      seen++; tries+=e[2]; wrong+=e[3];
      if (e[0]>=4) learned++;
      if (e[1]<=today()) due++;
    }
    return {t, seen, learned, due, tries, wrong, total:FEAT.length};
  });
  const weak = [];
  for (const t of Object.keys(DRILLS)) for (const f of FEAT){
    const e = PROG[itemKey(t,f)];
    if (e && e[3]>=2 && e[3]/Math.max(1,e[2])>=0.34) weak.push({f,e});
  }
  weak.sort((a,b)=>(b.e[3]/b.e[2])-(a.e[3]/a.e[2]) || b.e[3]-a.e[3]);
  const tot = k=>stats.reduce((a,s)=>a+s[k],0);
  $("#progress").innerHTML = `<h2>Progress</h2>
    <div class="pgStats">
      <div class="pgStat"><b>${fmtNum(tot("seen"))}</b><span>practised</span></div>
      <div class="pgStat"><b>${fmtNum(tot("due"))}</b><span>due for review</span></div>
      <div class="pgStat"><b>${tot("tries")?Math.round((1-tot("wrong")/tot("tries"))*100):0}%</b><span>answered right</span></div>
      <div class="pgStat"><b>${fmtNum(tot("tries"))}</b><span>questions answered</span></div>
    </div>
    <h3>By drill</h3>
    <table class="pgTable"><thead><tr><th>Drill</th><th>Practised</th><th>Known well</th><th>Due</th><th style="width:26%">Coverage</th></tr></thead><tbody>
      ${stats.map(s=>`<tr><td>${esc(DRILLS[s.t].label)}</td><td class="pgNum">${fmtNum(s.seen)} / ${fmtNum(s.total)}</td>
        <td class="pgNum">${fmtNum(s.learned)}</td><td class="pgNum">${fmtNum(s.due)}</td>
        <td><span class="pgBar"><i style="width:${s.total?Math.round(s.learned/s.total*100):0}%"></i></span></td></tr>`).join("")}
    </tbody></table>
    <p class="pgSrc">“Known well” means an item has reached box 4 of 5, so it will not come round again for a couple of weeks.</p>
    <h3>Worth another look</h3>
    ${weak.length?`<div class="pgWeak">${weak.slice(0,30).map(w=>`<button data-look="${w.f.i}" title="wrong ${w.e[3]} of ${w.e[2]}">${esc(w.f.name)} <span class="pgWn">${w.e[3]}/${w.e[2]}</span></button>`).join("")}</div>`
      : `<p class="err">Nothing is giving you trouble yet. Items appear here once you have missed them a few times.</p>`}
    <h3>Your data</h3>
    <p class="pgSrc">Progress lives in this browser only and is never sent anywhere. Export it to move it to another device or keep a backup.</p>
    <div class="actions">
      <button class="btn" id="pExport">Export</button>
      <button class="btn" id="pImport">Import</button>
      <button class="btn" id="pErase">Erase all progress</button>
      <button class="btn quiet" data-mode="drill">Back to the drill</button>
    </div>
    <p class="status" id="pStatus" role="status"></p>`;
}
$("#progress").addEventListener("click",e=>{
  const l = e.target.closest("[data-look]");
  if (l) return showDetails(+l.dataset.look);
  if (e.target.closest("#pExport")) return openIO("export");
  if (e.target.closest("#pImport")) return openIO("import");
  if (e.target.closest("#pErase")){
    const s = $("#pStatus");
    if (s.dataset.arm!=="1"){ s.dataset.arm="1"; s.className="status bad"; s.textContent="Click again to erase all progress. This cannot be undone."; return; }
    PROG = Object.create(null); LS.del(PROG_LS); renderProgress();
    $("#pStatus").className="status ok"; $("#pStatus").textContent="All progress erased.";
  }
});
const ioDlg = $("#iodlg");
let ioMode = "export";
function openIO(m){
  ioMode = m;
  $("#ioname").textContent = m==="export" ? "Export your progress" : "Import progress";
  $("#ioLead").textContent = m==="export"
    ? "Copy this text and keep it somewhere safe, or paste it into Terrain Atlas on another device."
    : "Paste an exported block here. Where both sides know an item, whichever record is further along wins.";
  $("#ioAct").textContent = m==="export" ? "Select all" : "Import";
  $("#ioText").value = m==="export" ? JSON.stringify({app:"terrainatlas", v:1, at:new Date().toISOString().slice(0,10), p:PROG}) : "";
  $("#ioText").readOnly = m==="export";
  $("#ioStatus").textContent = ""; $("#ioStatus").className = "status";
  if (!ioDlg.open) ioDlg.showModal();
}
$("#ioAct").addEventListener("click",()=>{
  const s = $("#ioStatus");
  if (ioMode==="export"){ $("#ioText").select(); s.className="status ok"; s.textContent="Selected, copy it now."; return; }
  let data;
  try{ data = JSON.parse($("#ioText").value.slice(0,4e6)); }
  catch{ s.className="status bad"; s.textContent="That is not valid exported data."; return; }
  if (!data || data.app!=="terrainatlas" || !data.p || typeof data.p!=="object" || Array.isArray(data.p)){
    s.className="status bad"; s.textContent="That does not look like a Terrain Atlas export."; return;
  }
  let added=0, merged=0;
  for (const [k,v] of Object.entries(data.p)){
    if (typeof k!=="string" || k.length>90 || !Array.isArray(v) || v.length!==4) continue;
    const e = v.map(x=>Number.isInteger(x)?x:0);
    if (e[0]<1 || e[0]>BOXES.length) continue;
    const cur = PROG[k];
    if (!cur){ PROG[k]=e; added++; }
    else if (e[0]>cur[0] || (e[0]===cur[0] && e[1]>cur[1])){ PROG[k]=e; merged++; }
  }
  LS.set(PROG_LS, JSON.stringify(PROG));
  s.className="status ok"; s.textContent=`Imported. ${added} new, ${merged} updated.`;
  renderProgress();
});
ioDlg.addEventListener("click",e=>{ if (e.target===ioDlg || e.target.closest("[data-close]")) ioDlg.close(); });

/* ============================ modes ============================ */
let mode = "explore";
function setMode(m){
  if (!["explore","drill","prog"].includes(m)) return;
  mode = m;
  document.body.className = m==="prog" ? "prog" : m;
  document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.mode===m)));
  $("#searchWrap").hidden = m!=="explore";
  $("#progress").hidden = m!=="prog";
  hideTip(); svg.classList.remove("aim");
  if (m!=="explore") closePanel();
  if (m==="drill") renderSetup();
  else {
    $("#setup").hidden = true; $("#drillbar").hidden = true;
    if (DS.item){ mark(DS.item.i,false); DS.item = null; }
    peaFilter = null; setOverlay([]); restoreLayers();
  }
  if (m==="prog") renderProgress();
}
document.addEventListener("click",e=>{ const b = e.target.closest("[data-mode]"); if (b) setMode(b.dataset.mode); });

/* ============================ start ============================ */
buildCountries(); buildFeats(); renderLayers(); syncProj(); size(); home();
</script>
