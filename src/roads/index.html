<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://flagcdn.com; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Roads</title>
    <link rel="icon" href="../icons/roads.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../fonts/fonts.css" />
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="../shared/drill.css" />
    <link rel="stylesheet" href="../shared/progress.css" />
    <link rel="stylesheet" href="../shared/dialog.css" />
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body class="explore">
    <header class="top">
      <a class="home" href="../" title="Atlas Trainer: all apps" aria-label="All apps">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <rect x="3" y="3" width="7.5" height="7.5" rx="2" />
          <rect x="13.5" y="3" width="7.5" height="7.5" rx="2" />
          <rect x="3" y="13.5" width="7.5" height="7.5" rx="2" />
          <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2" />
        </svg>
        <span>All apps</span>
      </a>
      <h1><a href="../">Roads</a></h1>
      <label class="search" id="searchWrap">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-4-4" />
        </svg>
        <input
          id="q"
          type="search"
          maxlength="60"
          placeholder="Find a country"
          autocomplete="off"
          aria-label="Find a country"
        />
      </label>
      <span class="spacer"></span>
      <div class="seg" role="group" aria-label="Mode">
        <button data-mode="explore" aria-pressed="true">Explore</button>
        <button data-mode="drill" aria-pressed="false">Drill</button>
        <button data-mode="prog" aria-pressed="false">Progress</button>
      </div>
    </header>

    <div id="stage">
      <main id="browse" aria-label="Roads">
        <p class="intro">
          What the roads of the Street View countries give away: the side they drive on, the colour
          of the centre line, and the stop, crossing, chevron and warning signs. Every fact links to
          its source.
        </p>
        <div class="filters" role="group" aria-label="Show">
          <button class="chip" data-view="country" aria-pressed="true">By country</button>
        </div>
        <div id="cards"></div>
        <p class="credits-line">
          <button class="linkish" data-credits>Sources and drawing credits</button>
        </p>
      </main>
      <section id="scene" class="scene" hidden aria-live="polite">
        <div id="sceneArt" class="scene-art"></div>
        <p class="scene-note" id="sceneNote"></p>
      </section>
      <section id="setup" class="card" hidden aria-label="Drill setup"></section>
      <section id="drillbar" class="qbar" hidden aria-label="Drill"></section>
      <section id="progress" class="card pg" hidden aria-label="Progress"></section>
      <p class="page-status" id="pageStatus" role="status">Loading the roads…</p>
    </div>

    <dialog id="detail" aria-labelledby="dName">
      <div class="dlg" tabindex="-1"></div>
    </dialog>
  </body>
</html>
