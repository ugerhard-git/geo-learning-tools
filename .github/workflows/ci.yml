# Lint, build and test every pull request. On main, the same run then deploys
# the built site to GitHub Pages, so nothing reaches the site without passing
# the checks first.
#
# Third-party actions are pinned to a full commit SHA rather than a tag, since
# a tag can be moved to point at different code. Dependabot keeps the pins
# current (see .github/dependabot.yml); the comment beside each pin records
# the release it corresponds to.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing gets write access unless a job asks for it below.
permissions: {}

# A new push to a pull request supersedes the run already going. On main,
# runs are left to finish, so a deployment is never cut off by the next merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job never pushes, so do not leave a token in .git/config.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install browser for tests
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Keep the test report if anything failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Package the site for Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can publish, and only through the github-pages
    # environment, whose deployment rules are set in the repository settings.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never cancel a deployment halfway through.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
